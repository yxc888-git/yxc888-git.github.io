<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线客服 · 知行软件 | 郑州宝泽利余晓春</title>
<meta name="description" content="知行饭店/美业管理系统在线客服，秒答安装、激活、使用问题。 郑州宝泽利余晓春（电话微信 15639928315）。">
<link rel="canonical" href="https://yxc888-git.github.io/bot.html">
<meta name="robots" content="index,follow">
<style>
  :root{
    --bg:#ffffff; --card:#f7f8fa; --line:#e3e6ea; --bubble:#eef4fb;
    --tx:#1a1d21; --tx2:#5b6470; --tx3:#8a929c;
    --acc:#185fa5; --ok:#0f6e56; --err:#a32d2d; --wa:#07c160;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14161a; --card:#1d2026; --line:#2c3038; --bubble:#1c2a38;
           --tx:#e8eaed; --tx2:#a8b0ba; --tx3:#7b838e;
           --acc:#85b7eb; --ok:#5dcaa5; --err:#f09595; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       line-height:1.65;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:12px;flex-shrink:0}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--acc);
        display:grid;place-items:center;color:#fff;font-size:15px;flex-shrink:0}
  .t1{font-size:15px;font-weight:500;line-height:1.3}
  .t2{font-size:12px;color:var(--tx3)}
  .spacer{flex:1}
  .prod{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .prod button{font:inherit;font-size:13px;padding:6px 14px;border:0;cursor:pointer;
               background:transparent;color:var(--tx2)}
  .prod button.on{background:var(--acc);color:#fff}
  main{flex:1;overflow-y:auto;padding:20px}
  .inner{max-width:720px;margin:0 auto}
  .msg{margin-bottom:14px;display:flex}
  .msg.bot{justify-content:flex-start}
  .msg.me{justify-content:flex-end}
  .bub{max-width:78%;padding:11px 15px;border-radius:14px;font-size:14px;
       white-space:pre-wrap;word-break:break-word}
  .bot .bub{background:var(--bubble);border-bottom-left-radius:4px}
  .me .bub{background:var(--acc);color:#fff;border-bottom-right-radius:4px}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
  .quick button{font:inherit;font-size:13px;padding:7px 13px;border-radius:99px;
                border:1px solid var(--line);background:var(--card);
                color:var(--tx2);cursor:pointer}
  .quick button:hover{border-color:var(--acc);color:var(--acc)}
  footer{border-top:1px solid var(--line);padding:12px 20px;flex-shrink:0;background:var(--bg)}
  .bar{max-width:720px;margin:0 auto;display:flex;gap:10px}
  .bar textarea{flex:1;font:inherit;font-size:14px;padding:11px 14px;
                border:1px solid var(--line);border-radius:10px;background:var(--card);
                color:var(--tx);resize:none;height:46px;max-height:120px;line-height:1.5}
  .bar textarea:focus{outline:none;border-color:var(--acc)}
  .bar button{font:inherit;font-size:14px;padding:0 22px;border:0;border-radius:10px;
              background:var(--acc);color:#fff;cursor:pointer}
  .bar button:disabled{opacity:.5}
  .hint{max-width:720px;margin:8px auto 0;font-size:12px;color:var(--tx3)}
  footer a{color:var(--acc)}
</style>
</head>
<body>

<header>
  <div class="logo">知</div>
  <div>
    <div class="t1">知行客服小助手</div>
    <div class="t2">秒答安装 · 激活 · 使用问题</div>
  </div>
  <div class="spacer"></div>
  <div class="prod">
    <button id="pf" class="on" onclick="pick('food')">饭店</button>
    <button id="pb" onclick="pick('beauty')">美业</button>
  </div>
</header>

<main><div class="inner" id="log"></div></main>

<footer>
  <div class="bar">
    <textarea id="inp" rows="1" placeholder="打字问问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">机器人解决不了的，加微信 <a href="#">15639928315</a>，我本人回你。</div>
</footer>

<script src="/assets/js/bot.js"></script>
<script>
var log = document.getElementById('log');
var inp = document.getElementById('inp');
var sendBtn = document.getElementById('send');
var busy = false;

function add(text, who){
  var w = document.createElement('div');
  w.className = 'msg ' + who;
  var b = document.createElement('div');
  b.className = 'bub';
  b.textContent = text;
  w.appendChild(b);
  log.appendChild(w);
  log.parentElement.scrollTop = log.parentElement.scrollHeight;
  return b;
}

function quick(p, qs){
  var box = document.createElement('div');
  box.className = 'quick';
  qs.forEach(function(q){
    var b = document.createElement('button');
    b.textContent = q;
    b.onclick = function(){ ask(q); };
    box.appendChild(b);
  });
  log.appendChild(box);
}

function pick(p){
  ZhixingBot.setProduct(p);
  document.getElementById('pf').className = (p === 'food') ? 'on' : '';
  document.getElementById('pb').className = (p === 'beauty') ? 'on' : '';
  quick(p, p === 'food'
    ? ['多少钱','怎么安装','怎么开台点餐','怎么结账','激活码在哪','小票怎么打印']
    : ['多少钱','怎么安装','怎么开单','怎么约客','会员怎么充值','技师提成怎么设']);
}

function ask(q){
  if(busy) return;
  q = (q || '').trim();
  if(!q) return;
  add(q, 'me');
  inp.value = ''; inp.style.height = '46px';
  busy = true; sendBtn.disabled = true;
  var th = add('…', 'bot');
  ZhixingBot.ask(q).then(function(a){
    th.textContent = a;
    busy = false; sendBtn.disabled = false;
    log.parentElement.scrollTop = log.parentElement.scrollHeight;
    inp.focus();
  });
}

sendBtn.onclick = function(){ ask(inp.value); };
inp.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(inp.value); }
});
inp.addEventListener('input', function(){
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
});

ZhixingBot.ready().then(function(){
  add('您好，我是知行客服小助手 🍚\n问安装、激活、怎么用，我直接答。\n实在答不上来，加微信 15639928315 找我本人。', 'bot');
  pick('food');
  inp.focus();
});
</script>
</body>
</html>
